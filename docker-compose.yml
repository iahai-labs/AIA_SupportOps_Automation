services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supportops
      POSTGRES_USER: supportops
      POSTGRES_PASSWORD: supportops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportops -d supportops"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - supportops_pgdata:/var/lib/postgresql/data

volumes:
  supportops_pgdata:
